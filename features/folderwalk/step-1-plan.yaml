schema: szflow-plan/3
request:
  words: "Restart the work from the beginning of the szFlow workflow in the existing repository."
  type: new project
facts:
  repository: FolderWalk
  commit: unborn main
  size_limit: 8
  builds_at_once: 3
assess:
  chapter_1_answer: not run yet
  research: "needed: look outside"
  research_reason: Verify candidate terminal dependencies, filesystem behavior, and local test tooling.
scope:
  in:
    - Directory path and listing, keyboard navigation, and typed or pasted path entry with a stable display.
    - A student README, demo, independent tests, and five Rust standards results.
  out:
    - GitHub publication, which waits for EJ.
parts:
  - name: navigation
    estimate: 5
    kind: a new program of our own
    kind_note: Rust standard filesystem APIs supply the primitives for FolderWalk's snapshot and navigation behavior.
    design: written and reviewed
    pieces:
      - name: navigation
        holds: startup, listing, child and parent navigation, paths, and errors
        count: 5
  - name: terminal
    estimate: 5
    kind: mostly an outside tool or library
    kind_note: Use Rustix for terminal I/O and Unicode Width for fitting text.
    needs_outside: [rustix, unicode-width]
    design: written and reviewed
    pieces:
      - name: terminal
        holds: display, selection, path editing, paste, and cleanup
        count: 5
  - name: integration
    estimate: 6
    kind: a new program of our own
    kind_note: Reuse Cargo, documented standards checkers, Bash, and Python's pseudo-terminal API.
    design: needs no design
    pieces:
      - name: integration
        holds: entry point, build, test execution, standards results, README, and demo
        count: 6
        waits_for: [navigation, terminal]
order:
  joining_rule: The coordinator owns src/main.rs and joins the two modules after their review and build.
accept:
  plan_accepted_by: the COO alone
