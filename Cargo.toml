[package]
name = "folderwalk"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A small terminal directory browser for students learning Rust"

[[bin]]
name = "fwalk"
path = "src/main.rs"

[dependencies]
rustix = { version = "=1.1.6", features = ["event", "fs", "termios"] }
unicode-width = "=0.2.2"
